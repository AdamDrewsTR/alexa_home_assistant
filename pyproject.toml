[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-alexa-setup"
version = "0.1.0"
description = "Self-managed Alexa relay and Home Assistant setup"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.11,<4",
  "boto3>=1.35,<2",
  "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
test = ["moto[dynamodb,ssm]>=5,<6"]

[project.scripts]
ha-alexa-setup = "wizard:main"
ha-alexa-connector = "addon.connector:main"

[tool.setuptools]
py-modules = ["wizard"]
packages = ["addon"]
