# Prefer the wizard: it installs custom_components/alexa_devices with backups.
# This manual example requires that component to be installed first.
# Merge into configuration.yaml; do not duplicate existing blocks.
# Do not configure alexa.smart_home at the same time.
alexa: {}
alexa_devices:
  locale: en-US
  filter:
    include_entities:
      - light.kitchen
      - sensor.kitchen_temperature
      - lock.front_door
      - script.good_night
  # Selected entities on the same physical HA device share an Alexa endpoint.
  # Enable Send Alexa Events and use the Smart Home skill's event credentials.
  endpoint: https://api.amazonalexa.com/v3/events
  client_id: !secret alexa_event_client_id
  client_secret: !secret alexa_event_client_secret

intent_script:
  HomeStatusIntent:
    speech:
      type: plain
      text: >-
        The kitchen light is {{ states('light.kitchen') }}.
  AMAZON.HelpIntent:
    speech:
      type: plain
      text: You can ask me for the home status.
  AMAZON.CancelIntent:
    speech:
      type: plain
      text: Goodbye.
  AMAZON.StopIntent:
    speech:
      type: plain
      text: Goodbye.
  AMAZON.FallbackIntent:
    speech:
      type: plain
      text: I did not understand. Try asking for the home status.

# For "Alexa, open home assistant", also add an intent_script entry whose
# key is your Custom skill ID, with a welcome speech and optional reprompt.
